<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Explore Nature</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="contact-page">

   <!-- Navigation Section -->
     <nav>
        <div class="logo">
           
           BornFire 
        </div>
        <div>
            <a href="home.html">Home</a>
            <a href="about.html">Destinations</a>
            <a href="services.html">Our story</a>
            <a href="contact.html">Contact</a>          
        </div>
    </nav>

    <!-- Hero section -->
    <section class="hero-contact">
        
           <h1>Contact us</h1>
           <p>Have questions or feedback? We'd love to hear from you!</p>
            
    </section>

    <main class="container">
        <div class="left">
           
            <img src="https://plus.unsplash.com/premium_photo-1673292293042-cafd9c8a3ab3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="A peaceful nature landscape">
            <h2>Contact Information</h2>
            <p>Email: info@explorenature.com</p>
            <p>Phone: +254781342265</p>
            <p>Address: 123 Main Street, City, State 12345</p>
        </div>

        <div class="right">
            <form action="" class="contact-form">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="suggestions">Suggestions:</label>
                <textarea id="suggestions" name="suggestions" rows="5" required></textarea>

                <button type="submit">Post message</button>

            </form>

        </div>
    </main>
 
</body>
</html>
